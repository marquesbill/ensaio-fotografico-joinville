<!doctype html>
<html lang="en">

    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <title>Ensaio Fotográfico em Joinville</title>

    <!--
      Skip analytics em rotas internas (/admin, /dashboard).
      Sem esse gate, andre/mari/elisa contaminam GA4 / Pixel / Clarity
      toda vez que abrem o painel pra trabalhar.
    -->
    <script>
      (function () {
        var p = (window.location.pathname || '').toLowerCase();
        window.__skipAnalytics = (p.indexOf('/admin') === 0 || p.indexOf('/dashboard') === 0);
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script>
      if (!window.__skipAnalytics) {
        var gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-MZ7W1XRY73';
        document.head.appendChild(gtagScript);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-MZ7W1XRY73');
      }
    </script>
    <!-- End Google tag -->

    <!-- Meta Pixel Code -->
    <script>
      if (!window.__skipAnalytics) {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1117650036922205');
        fbq('track', 'PageView');
      }
    </script>
    <!-- End Meta Pixel Code -->

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      if (!window.__skipAnalytics) {
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "ws5wo65fne");
      }
    </script>
    <!-- End Microsoft Clarity -->
  </head>

    <!-- Meta Pixel noscript fallback (só dispara se usuário tiver JS off, raro e provavelmente não é admin) -->

      <img height="1" width="1" style="display:none"
